# Customer deployment: Nuntio + PostgreSQL + Caddy (automatic HTTPS).
#
#   cp .env.example .env   # set NUNTIO_DOMAIN, POSTGRES_PASSWORD, NUNTIO_LICENSE
#   docker compose up -d
#   docker compose exec nuntio /app/nuntio init --org "My Company" --admin admin --password 'change-me'
#
# Update: docker compose pull && docker compose up -d   (migrations run on start)

services:
  nuntio:
    image: ${NUNTIO_IMAGE:-ghcr.io/b1ll1eee/nuntio:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NUNTIO_DATABASE_URL: postgres://nuntio:${POSTGRES_PASSWORD}@postgres:5432/nuntio?sslmode=disable
      NUNTIO_PUBLIC_URL: https://${NUNTIO_DOMAIN}
      NUNTIO_COOKIE_SECURE: "true"
      NUNTIO_LICENSE: ${NUNTIO_LICENSE:-}
      NUNTIO_ENVIRONMENT: ${NUNTIO_ENVIRONMENT:-production}
      NUNTIO_VINDICE_ENDPOINT: ${NUNTIO_VINDICE_ENDPOINT:-}
      NUNTIO_VINDICE_API_KEY: ${NUNTIO_VINDICE_API_KEY:-}
      NUNTIO_MAX_FILE_MB: ${NUNTIO_MAX_FILE_MB:-25}
    volumes:
      - nuntio-data:/app/data
    expose:
      - "8080"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nuntio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nuntio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuntio"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - nuntio
    environment:
      NUNTIO_DOMAIN: ${NUNTIO_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  nuntio-data:
  postgres-data:
  caddy-data:
  caddy-config:
