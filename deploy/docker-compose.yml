# Customer deployment: Messario + PostgreSQL + Caddy (automatic HTTPS).
#
#   cp .env.example .env   # set MESSARIO_DOMAIN, POSTGRES_PASSWORD, MESSARIO_LICENSE
#   docker compose up -d
#   docker compose exec messario /app/messario init --org "My Company" --admin admin --password 'change-me'
#
# Update: docker compose pull && docker compose up -d   (migrations run on start)

services:
  messario:
    image: ${MESSARIO_IMAGE:-ghcr.io/b1ll1eee/messario:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MESSARIO_DATABASE_URL: postgres://messario:${POSTGRES_PASSWORD}@postgres:5432/messario?sslmode=disable
      MESSARIO_PUBLIC_URL: https://${MESSARIO_DOMAIN}
      MESSARIO_COOKIE_SECURE: "true"
      MESSARIO_LICENSE: ${MESSARIO_LICENSE:-}
      MESSARIO_ENVIRONMENT: ${MESSARIO_ENVIRONMENT:-production}
      MESSARIO_VINDICE_ENDPOINT: ${MESSARIO_VINDICE_ENDPOINT:-}
      MESSARIO_VINDICE_API_KEY: ${MESSARIO_VINDICE_API_KEY:-}
      MESSARIO_MAX_FILE_MB: ${MESSARIO_MAX_FILE_MB:-25}
    volumes:
      - messario-data:/app/data
    expose:
      - "8080"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: messario
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: messario
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messario"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - messario
    environment:
      MESSARIO_DOMAIN: ${MESSARIO_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  messario-data:
  postgres-data:
  caddy-data:
  caddy-config:
