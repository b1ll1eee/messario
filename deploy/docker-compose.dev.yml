# Development dependencies only. Run the Go binary on the host: `make dev`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nuntio
      POSTGRES_PASSWORD: nuntio
      POSTGRES_DB: nuntio
    ports:
      - "5432:5432"
    volumes:
      - nuntio-pg-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuntio"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  nuntio-pg-dev:
