# Development dependencies only. Run the Go binary on the host: `make dev`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: messario
      POSTGRES_PASSWORD: messario
      POSTGRES_DB: messario
    ports:
      - "5432:5432"
    volumes:
      - messario-pg-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messario"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  messario-pg-dev:
